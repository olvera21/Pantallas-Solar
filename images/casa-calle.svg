<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Casa con local en calle">
  <rect width="800" height="600" fill="#FEFEE3"/>
  <circle cx="700" cy="90" r="40" fill="#C9E8A0"/>
  <rect x="0" y="470" width="800" height="130" fill="#DCDCD5"/>
  <line x1="0" y1="540" x2="800" y2="540" stroke="#FBFBFA" stroke-width="8" stroke-dasharray="40 30"/>

  <!-- house 1: with ground-floor local (shop) -->
  <rect x="60" y="270" width="200" height="200" fill="#FFFFFF" stroke="#15171A" stroke-width="6"/>
  <polygon points="45,270 160,190 275,270" fill="#15171A"/>
  <rect x="80" y="300" width="55" height="55" fill="#FEFEE3" stroke="#15171A" stroke-width="5"/>
  <rect x="185" y="300" width="55" height="55" fill="#FEFEE3" stroke="#15171A" stroke-width="5"/>
  <rect x="75" y="390" width="170" height="80" fill="#6FA23C"/>
  <rect x="90" y="400" width="60" height="55" fill="#FEFEE3" stroke="#15171A" stroke-width="4"/>
  <rect x="170" y="400" width="60" height="55" fill="#FEFEE3" stroke="#15171A" stroke-width="4"/>
  <rect x="70" y="465" width="180" height="14" fill="#C9E8A0"/>

  <!-- house 2: taller, center -->
  <rect x="310" y="200" width="180" height="270" fill="#FFFFFF" stroke="#15171A" stroke-width="6"/>
  <polygon points="300,200 400,130 500,200" fill="#15171A"/>
  <rect x="335" y="225" width="45" height="45" fill="#FEFEE3" stroke="#15171A" stroke-width="4"/>
  <rect x="420" y="225" width="45" height="45" fill="#FEFEE3" stroke="#15171A" stroke-width="4"/>
  <rect x="335" y="300" width="45" height="45" fill="#FEFEE3" stroke="#15171A" stroke-width="4"/>
  <rect x="420" y="300" width="45" height="45" fill="#FEFEE3" stroke="#15171A" stroke-width="4"/>
  <rect x="375" y="395" width="50" height="75" fill="#15171A"/>

  <!-- house 3: smaller, right -->
  <rect x="540" y="310" width="170" height="160" fill="#FFFFFF" stroke="#15171A" stroke-width="6"/>
  <polygon points="528,310 625,255 722,310" fill="#15171A"/>
  <rect x="565" y="335" width="50" height="50" fill="#FEFEE3" stroke="#15171A" stroke-width="4"/>
  <rect x="640" y="335" width="50" height="50" fill="#FEFEE3" stroke="#15171A" stroke-width="4"/>
  <rect x="600" y="405" width="55" height="65" fill="#6FA23C"/>

  <!-- streetlamp -->
  <rect x="20" y="420" width="6" height="90" fill="#15171A"/>
  <circle cx="23" cy="412" r="12" fill="#C9E8A0"/>
</svg>
