<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Casa con jardín, dos plantas">
  <rect width="800" height="600" fill="#FEFEE3"/>
  <circle cx="670" cy="100" r="46" fill="#C9E8A0"/>
  <rect x="0" y="430" width="800" height="170" fill="#DCE8BE"/>
  <path d="M0 430 Q400 400 800 430 L800 460 Q400 430 0 460 Z" fill="#E9F1D4"/>

  <!-- trees -->
  <g>
    <rect x="92" y="330" width="14" height="90" fill="#15171A"/>
    <circle cx="99" cy="300" r="52" fill="#8FAE55"/>
    <circle cx="60" cy="330" r="34" fill="#9DBD62"/>
    <circle cx="140" cy="330" r="34" fill="#9DBD62"/>
  </g>
  <g>
    <rect x="682" y="350" width="12" height="70" fill="#15171A"/>
    <circle cx="688" cy="330" r="40" fill="#9DBD62"/>
  </g>

  <!-- walkway -->
  <polygon points="360,430 440,430 470,600 330,600" fill="#FBFBFA" stroke="#D3D3CC" stroke-width="3"/>

  <!-- house body (2 stories) -->
  <rect x="230" y="230" width="300" height="200" fill="#FFFFFF" stroke="#15171A" stroke-width="6"/>
  <!-- roof -->
  <polygon points="205,230 380,120 555,230" fill="#15171A"/>
  <rect x="365" y="150" width="30" height="46" fill="#15171A"/>

  <!-- upper floor windows -->
  <rect x="260" y="255" width="55" height="55" fill="#FEFEE3" stroke="#15171A" stroke-width="5"/>
  <rect x="445" y="255" width="55" height="55" fill="#FEFEE3" stroke="#15171A" stroke-width="5"/>
  <line x1="287" y1="255" x2="287" y2="310" stroke="#15171A" stroke-width="4"/>
  <line x1="260" y1="282" x2="315" y2="282" stroke="#15171A" stroke-width="4"/>
  <line x1="472" y1="255" x2="472" y2="310" stroke="#15171A" stroke-width="4"/>
  <line x1="445" y1="282" x2="500" y2="282" stroke="#15171A" stroke-width="4"/>

  <!-- ground floor: door + window -->
  <rect x="345" y="345" width="70" height="85" fill="#6FA23C"/>
  <circle cx="405" cy="390" r="4" fill="#FEFEE3"/>
  <rect x="255" y="355" width="60" height="60" fill="#FEFEE3" stroke="#15171A" stroke-width="5"/>
  <line x1="285" y1="355" x2="285" y2="415" stroke="#15171A" stroke-width="4"/>
  <line x1="255" y1="385" x2="315" y2="385" stroke="#15171A" stroke-width="4"/>
  <rect x="450" y="355" width="60" height="60" fill="#FEFEE3" stroke="#15171A" stroke-width="5"/>
  <line x1="480" y1="355" x2="480" y2="415" stroke="#15171A" stroke-width="4"/>
  <line x1="450" y1="385" x2="510" y2="385" stroke="#15171A" stroke-width="4"/>

  <!-- garden hedges -->
  <rect x="170" y="415" width="70" height="18" rx="9" fill="#9DBD62"/>
  <rect x="560" y="415" width="70" height="18" rx="9" fill="#9DBD62"/>
</svg>
