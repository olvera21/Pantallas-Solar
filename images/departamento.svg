<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Departamento remodelado">
  <rect width="800" height="600" fill="#FEFEE3"/>
  <circle cx="120" cy="100" r="42" fill="#C9E8A0"/>
  <rect x="0" y="470" width="800" height="130" fill="#E3ECC9"/>

  <!-- building -->
  <rect x="140" y="140" width="520" height="330" fill="#FFFFFF" stroke="#15171A" stroke-width="6"/>

  <!-- floor divider lines -->
  <line x1="140" y1="250" x2="660" y2="250" stroke="#15171A" stroke-width="4"/>
  <line x1="140" y1="360" x2="660" y2="360" stroke="#15171A" stroke-width="4"/>

  <!-- windows/balconies row 1 -->
  <g>
    <rect x="175" y="170" width="90" height="60" fill="#FEFEE3" stroke="#15171A" stroke-width="5"/>
    <rect x="175" y="230" width="90" height="10" fill="#15171A"/>
    <rect x="355" y="170" width="90" height="60" fill="#FEFEE3" stroke="#15171A" stroke-width="5"/>
    <rect x="355" y="230" width="90" height="10" fill="#15171A"/>
    <rect x="535" y="170" width="90" height="60" fill="#FEFEE3" stroke="#15171A" stroke-width="5"/>
    <rect x="535" y="230" width="90" height="10" fill="#15171A"/>
  </g>

  <!-- row 2 -->
  <g>
    <rect x="175" y="280" width="90" height="60" fill="#FEFEE3" stroke="#15171A" stroke-width="5"/>
    <rect x="175" y="340" width="90" height="10" fill="#15171A"/>
    <rect x="355" y="280" width="90" height="60" fill="#FEFEE3" stroke="#15171A" stroke-width="5"/>
    <rect x="355" y="340" width="90" height="10" fill="#15171A"/>
    <rect x="535" y="280" width="90" height="60" fill="#FEFEE3" stroke="#15171A" stroke-width="5"/>
    <rect x="535" y="340" width="90" height="10" fill="#15171A"/>
  </g>

  <!-- ground floor: entrance + planters -->
  <rect x="365" y="390" width="70" height="80" fill="#6FA23C"/>
  <circle cx="420" cy="430" r="4" fill="#FEFEE3"/>
  <rect x="200" y="410" width="80" height="60" fill="#FEFEE3" stroke="#15171A" stroke-width="5"/>
  <rect x="520" y="410" width="80" height="60" fill="#FEFEE3" stroke="#15171A" stroke-width="5"/>
  <rect x="160" y="465" width="60" height="16" rx="8" fill="#9DBD62"/>
  <rect x="580" y="465" width="60" height="16" rx="8" fill="#9DBD62"/>
</svg>
