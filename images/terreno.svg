<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Terreno disponible">
  <rect width="800" height="600" fill="#FEFEE3"/>
  <circle cx="120" cy="110" r="46" fill="#C9E8A0"/>

  <!-- distant hills -->
  <path d="M0 360 Q140 320 280 355 Q420 385 560 350 Q680 322 800 355 L800 420 L0 420 Z" fill="#DCE8BE"/>
  <!-- lot -->
  <rect x="0" y="420" width="800" height="180" fill="#CFE0AC"/>
  <path d="M0 420 Q400 400 800 420 L800 445 Q400 425 0 445 Z" fill="#DCE8BE"/>

  <!-- grass texture -->
  <g stroke="#B7CE8C" stroke-width="4" stroke-linecap="round">
    <line x1="60" y1="470" x2="55" y2="450"/>
    <line x1="90" y1="480" x2="88" y2="458"/>
    <line x1="150" y1="500" x2="146" y2="475"/>
    <line x1="230" y1="465" x2="226" y2="445"/>
    <line x1="330" y1="510" x2="326" y2="484"/>
    <line x1="480" y1="470" x2="476" y2="448"/>
    <line x1="560" y1="500" x2="556" y2="474"/>
    <line x1="650" y1="460" x2="646" y2="440"/>
    <line x1="720" y1="495" x2="716" y2="470"/>
  </g>

  <!-- corner stakes with string boundary -->
  <g stroke="#15171A" stroke-width="4">
    <line x1="120" y1="560" x2="120" y2="500"/>
    <line x1="680" y1="560" x2="680" y2="500"/>
    <line x1="400" y1="430" x2="400" y2="390"/>
    <line x1="120" y1="500" x2="400" y2="390"/>
    <line x1="680" y1="500" x2="400" y2="390"/>
  </g>
  <circle cx="120" cy="560" r="7" fill="#15171A"/>
  <circle cx="680" cy="560" r="7" fill="#15171A"/>
  <circle cx="400" cy="390" r="7" fill="#15171A"/>

  <!-- for sale sign -->
  <rect x="580" y="330" width="10" height="90" fill="#15171A"/>
  <rect x="540" y="290" width="120" height="60" rx="6" fill="#FFFFFF" stroke="#15171A" stroke-width="5"/>
  <text x="600" y="328" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#15171A" text-anchor="middle">SE VENDE</text>
</svg>
